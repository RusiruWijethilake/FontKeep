name: 🚀 Production Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------------
  # JOB 1: DEFINE VERSION & GENERATE CHANGELOG
  # -----------------------------------------------------------------------------
  versioning:
    name: 🏷️ Version & Notes
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      is_prerelease: ${{ steps.set_version.outputs.is_prerelease }}
      release_notes: ${{ steps.generate_notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: set_version
        run: |
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            VERSION="0.0.${{ github.run_number }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "🔹 Detected Develop Branch. Version: $VERSION"
          else
            VERSION="${{ github.ref_name }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "🟢 Detected Release Branch. Version: $VERSION"
          fi

      - name: Generate Release Notes
        id: generate_notes
        shell: bash
        run: |
          IS_PRE="${{ steps.set_version.outputs.is_prerelease }}"
          
          if [[ "$IS_PRE" == "true" ]]; then
            NOTES="⚠️ **Pre-release Build**\n\nThis is a development build. Changes are not listed for pre-releases."
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo -e "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          # (Log parsing logic omitted for brevity - same as before)
          # ... [Keep your existing log parsing logic here] ... 
          # For this snippet, I'm assuming you keep the exact logic you had in your previous message.
          
          # Placeholder for logic you already have:
          OUTPUT="🚀 **Release ${{ steps.set_version.outputs.version }}**\n\n(See commit history for details)"

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------------
  # JOB 2: WINDOWS
  # -----------------------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows
    needs: versioning
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        working-directory: fontkeep_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: choco install innosetup
      - run: dart pub global activate fastforge
      
      - name: Update Version
        run: |
          $ver = "${{ needs.versioning.outputs.version }}"
          (Get-Content pubspec.yaml) | ForEach-Object { $_ -replace '^version: .*', "version: $ver" } | Set-Content pubspec.yaml

      - name: Build & Zip Portable
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=NEW_RELIC_KEY=${{ secrets.NEW_RELIC_KEY }}
          New-Item -ItemType Directory -Force -Path "staging"
          $buildDir = "build\windows\x64\runner\Release"
          # UPDATED: Use FontKeep.exe
          $zipName = "staging\fontkeep-${{ needs.versioning.outputs.version }}-portable.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipName

      - name: Build Installers
        env:
          NEW_RELIC_KEY: ${{ secrets.NEW_RELIC_KEY }}
        run: fastforge package --platform windows --targets exe,msix

      - name: Organize Artifacts
        shell: pwsh
        run: |
          $ver = "${{ needs.versioning.outputs.version }}"
          if (Test-Path "dist") {
             Get-ChildItem -Path "dist" -Recurse -Include *.exe | ForEach-Object {
                Move-Item -Path $_.FullName -Destination "staging\fontkeep-$ver-windows-setup.exe" -Force
             }
             Get-ChildItem -Path "dist" -Recurse -Include *.msix | ForEach-Object {
                Move-Item -Path $_.FullName -Destination "staging\fontkeep-$ver-windows.msix" -Force
             }
          }
          cd staging
          Get-ChildItem * | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Out-File -Append checksums.txt }

      - name: VirusTotal Scan (Windows)
        if: env.VT_API_KEY != ''
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        shell: pwsh
        run: |
          $exePath = "staging\fontkeep-${{ needs.versioning.outputs.version }}-windows-setup.exe"
          if (Test-Path $exePath) {
             Write-Host "🔍 Uploading Windows EXE to VirusTotal..."
             $response = & curl.exe --silent --request POST --url "https://www.virustotal.com/api/v3/files" --header "x-apikey: $env:VT_API_KEY" --form "file=@$exePath"
             if ($response -match '"id":\s*"([^"]+)"') {
                 $id = $matches[1]
                 $link = "https://www.virustotal.com/gui/file-analysis/$id"
                 Write-Host "✅ Upload Complete: $link"
                 # Save to file for Release Job
                 Set-Content -Path "staging\vt_report_windows.txt" -Value "- 🪟 [Windows Installer Report]($link)"
             }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: fontkeep_app/staging/*
          retention-days: 1

  # -----------------------------------------------------------------------------
  # JOB 3: LINUX
  # -----------------------------------------------------------------------------
  build-linux:
    name: 🐧 Build Linux
    needs: versioning
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: fontkeep_app
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libfuse2 wget rpm
      - name: Install AppImageTool
        run: |
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: dart pub global activate fastforge

      - name: Update Version
        run: |
          sed -i 's/^version: .*/version: ${{ needs.versioning.outputs.version }}/g' pubspec.yaml

      - name: Build Linux Packages
        env:
          NEW_RELIC_KEY: ${{ secrets.NEW_RELIC_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: 1 
        run: fastforge package --platform linux --targets appimage,deb,rpm

      - name: Organize Artifacts
        run: |
          mkdir -p staging
          VER="${{ needs.versioning.outputs.version }}"
          find dist -name "*.AppImage" -exec cp {} staging/fontkeep-$VER-linux.AppImage \;
          find dist -name "*.deb" -exec cp {} staging/fontkeep-$VER-linux.deb \;
          find dist -name "*.rpm" -exec cp {} staging/fontkeep-$VER-linux.rpm \;
          cd staging && sha256sum * > checksums.txt

      - name: VirusTotal Scan (Linux)
        if: env.VT_API_KEY != ''
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          FILE_PATH="staging/fontkeep-${{ needs.versioning.outputs.version }}-linux.AppImage"
          if [ -f "$FILE_PATH" ]; then
            echo "🔍 Uploading AppImage to VirusTotal..."
            RESPONSE=$(curl --silent --request POST --url "https://www.virustotal.com/api/v3/files" --header "x-apikey: $VT_API_KEY" --form "file=@$FILE_PATH")
            ID=$(echo $RESPONSE | grep -o '"id": *"[^"]*"' | cut -d'"' -f4)
            if [ ! -z "$ID" ]; then
               LINK="https://www.virustotal.com/gui/file-analysis/$ID"
               echo "✅ Upload Complete: $LINK"
               echo "- 🐧 [Linux AppImage Report]($LINK)" > staging/vt_report_linux.txt
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: fontkeep_app/staging/*

  # -----------------------------------------------------------------------------
  # JOB 4: MACOS
  # -----------------------------------------------------------------------------
  build-macos:
    name: 🍎 Build macOS
    needs: versioning
    runs-on: macos-latest
    environment: production
    defaults:
      run:
        working-directory: fontkeep_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: npm install -g appdmg
      - run: dart pub global activate fastforge

      - name: Update Version
        run: |
          sed -i '' 's/^version: .*/version: ${{ needs.versioning.outputs.version }}/g' pubspec.yaml

      - name: Build & Zip Portable
        run: |
          flutter build macos --release --dart-define=NEW_RELIC_KEY=${{ secrets.NEW_RELIC_KEY }}
          mkdir -p staging
          cd build/macos/Build/Products/Release
          # ✅ FIXED: Now correctly zips FontKeep.app
          zip -r FontKeep.zip FontKeep.app
          mv FontKeep.zip $GITHUB_WORKSPACE/fontkeep_app/staging/fontkeep-${{ needs.versioning.outputs.version }}-macos.zip

      - name: Build Packages
        run: fastforge package --platform macos --targets dmg,pkg

      - name: Organize Artifacts
        run: |
          VER="${{ needs.versioning.outputs.version }}"
          find dist -name "*.dmg" -exec cp {} staging/fontkeep-$VER-macos.dmg \;
          find dist -name "*.pkg" -exec cp {} staging/fontkeep-$VER-macos.pkg \;
          cd staging && shasum -a 256 * > checksums.txt

      - name: VirusTotal Scan (macOS)
        if: env.VT_API_KEY != ''
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          FILE_PATH="staging/fontkeep-${{ needs.versioning.outputs.version }}-macos.dmg"
          if [ -f "$FILE_PATH" ]; then
            echo "🔍 Uploading DMG to VirusTotal..."
            RESPONSE=$(curl --silent --request POST --url "https://www.virustotal.com/api/v3/files" --header "x-apikey: $VT_API_KEY" --form "file=@$FILE_PATH")
            ID=$(echo $RESPONSE | grep -o '"id": *"[^"]*"' | cut -d'"' -f4)
            if [ ! -z "$ID" ]; then
               LINK="https://www.virustotal.com/gui/file-analysis/$ID"
               echo "✅ Upload Complete: $LINK"
               echo "- 🍎 [macOS DMG Report]($LINK)" > staging/vt_report_macos.txt
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: fontkeep_app/staging/*

  # -----------------------------------------------------------------------------
  # JOB 5: RELEASE
  # -----------------------------------------------------------------------------
  release:
    name: 📦 Publish Release
    if: always() 
    needs: [versioning, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Merge Checksums & Reports
        id: prepare_notes
        run: |
          cd release_assets
          
          # 1. Merge Checksums
          cat checksums.txt >> SHA256SUMS.txt || true
          sort -u SHA256SUMS.txt -o SHA256SUMS.txt
          rm checksums.txt || true
          
          # 2. Collect VirusTotal Reports
          VT_SECTION=""
          if ls vt_report_*.txt 1> /dev/null 2>&1; then
             VT_SECTION=$'\n\n### 🛡️ VirusTotal Scans\n'
             for report in vt_report_*.txt; do
               LINE=$(cat "$report")
               VT_SECTION+="$LINE"$'\n'
               rm "$report" # Cleanup so we don't upload txt files to release
             done
          fi
          
          # 3. Export to Github Env (Multiline safe)
          echo "VT_NOTES<<EOF" >> $GITHUB_ENV
          echo "$VT_SECTION" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.versioning.outputs.version }}
          name: Release v${{ needs.versioning.outputs.version }}
          draft: false
          prerelease: ${{ needs.versioning.outputs.is_prerelease }}
          body: |
            ${{ needs.versioning.outputs.release_notes }}
            ${{ env.VT_NOTES }}
          files: |
            release_assets/*.zip
            release_assets/*.msi
            release_assets/*.msix
            release_assets/*.exe
            release_assets/*.AppImage
            release_assets/*.deb
            release_assets/*.rpm
            release_assets/*.dmg
            release_assets/*.pkg
            release_assets/SHA256SUMS.txt
          generate_release_notes: false
